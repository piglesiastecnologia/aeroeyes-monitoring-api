name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitoring-api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: API tests and image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15.12-alpine
        env:
          POSTGRES_DB: aeroeyes_test
          POSTGRES_USER: aeroeyes
          POSTGRES_PASSWORD: aeroeyes_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeroeyes -d aeroeyes_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://aeroeyes:aeroeyes_ci_only@127.0.0.1:5432/aeroeyes_test
    steps:
      - name: Check out Monitoring API
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test and migration dependencies
        run: python -m pip install --upgrade pip && python -m pip install --editable '.[migration,test]'

      - name: Apply test database migrations
        run: python -m alembic upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Run tests
        run: python -m pytest

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile source
        run: python -m compileall -q src

      - name: Build Monitoring API image
        run: docker build --tag aeroeyes-monitoring-api:ci .
